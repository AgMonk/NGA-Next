name: NGA BBCode Smiles Sync

on:
  push:
    paths:
      - 'NGA-OFFICIAL-JS/data/bbscode.js'
  workflow_dispatch:          # 允许手动触发

concurrency:
  group: bbscode-smiles-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "bbscode-smiles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run parse_smiles.py
        run: |
          python3 --version
          python3 NGA-BBSCODE-SMILES/scripts/parse_smiles.py

      - name: Commit & push
        run: |
          git add NGA-BBSCODE-SMILES/data/groups.json NGA-BBSCODE-SMILES/data/groups.md
          if git diff --cached --quiet; then
            echo "表情数据无变化，跳过 commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "bbscode-smiles: sync $DATE"
          git push origin HEAD
