name: NGA Official JS Sync

on:
  schedule:
    # 每天 UTC 16:00 = 北京时间 0:00
    - cron: '0 16 * * *'
  workflow_dispatch:          # 允许手动触发

concurrency:
  group: official-js-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "official-js-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run fetch_scripts.py
        run: |
          python3 --version
          python3 NGA-OFFICIAL-JS/scripts/fetch_scripts.py

      - name: Commit & push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "scripts.json 无变化，跳过 commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "official-js: sync $DATE"
          git push origin HEAD
